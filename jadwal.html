<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMORI x Neo-Brutalism Content Scheduler</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #fcfbf7; /* Warm sketch paper white */
            --border-color: #111111;
            --shadow-color: #111111;
            --omori-purple: #9b84b3;
            --omori-mint: #84b395;
            --omori-yellow: #e6c86e;
            --omori-pink: #d97c8f;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Gaegu', cursive;
            color: #111;
            font-size: 1.35rem;
            font-weight: 700;
        }

        /* Hand-drawn / Wobbly Neo-Brutalist Border Trick */
        .omori-box {
            background: #ffffff;
            border: 3px solid var(--border-color);
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
            box-shadow: 5px 5px 0px var(--shadow-color);
            transition: all 0.2s ease-in-out;
        }

        .omori-box:hover {
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px var(--shadow-color);
        }

        .omori-btn {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 1.2rem;
            background-color: #fff;
            border: 3px solid var(--border-color);
            border-radius: 15px 225px 15px 255px/255px 15px 225px 15px;
            box-shadow: 4px 4px 0px var(--shadow-color);
            cursor: pointer;
            padding: 8px 16px;
            color: #111;
        }

        .omori-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--shadow-color);
        }

        .omori-btn-primary { background-color: var(--omori-purple); color: #fff; }
        .omori-btn-success { background-color: var(--omori-mint); color: #111; }

        .form-select-omori {
            font-family: 'Gaegu', cursive;
            font-weight: 700;
            font-size: 1.1rem;
            border: 2px solid #111;
            border-radius: 10px 200px 10px 200px/200px 10px 200px 10px;
            box-shadow: 2px 2px 0px #111;
            background-color: #fff;
            cursor: pointer;
        }

        /* Status Colors */
        .status-planning { background-color: var(--omori-yellow); }
        .status-progress { background-color: var(--omori-pink); color: white; }
        .status-done { background-color: var(--omori-mint); }

        .badge-omori {
            display: inline-block;
            padding: 4px 10px;
            border: 2px solid #111;
            border-radius: 255px 10px 225px 10px/10px 225px 10px 255px;
            box-shadow: 2px 2px 0px #111;
            font-size: 1rem;
        }

        .table-custom {
            border-collapse: separate;
            border-spacing: 0 15px;
        }

        .table-custom tr td {
            background: #fff;
            vertical-align: middle;
            border-top: 3px solid #111;
            border-bottom: 3px solid #111;
        }

        .table-custom tr td:first-child {
            border-left: 3px solid #111;
            border-top-left-radius: 15px;
            border-bottom-left-radius: 10px;
        }

        .table-custom tr td:last-child {
            border-right: 3px solid #111;
            border-top-right-radius: 10px;
            border-bottom-right-radius: 15px;
            box-shadow: 4px 4px 0px #111;
        }

        /* Custom SweetAlert to match theme */
        .swal2-popup {
            font-family: 'Gaegu', cursive !important;
            border: 4px solid #111 !important;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px !important;
            box-shadow: 8px 8px 0px #111 !important;
            background-color: var(--bg-color) !important;
        }
        .swal2-title { font-weight: 700 !important; font-size: 2rem !important; }
        .swal2-input { 
            font-family: 'Gaegu', cursive !important; 
            font-weight: 700 !important; 
            border: 2px solid #111 !important; 
            box-shadow: 3px 3px 0px #111 !important; 
        }
    </style>
</head>
<body>

<div class="container py-5">
    <header class="d-flex justify-content-between align-items-center mb-5 omori-box p-4">
        <div>
            <h1 class="display-5 fw-bold mb-0">🗒️ CONTENT SCHEDULER</h1>
            <p class="text-muted mb-0" style="font-size: 1.2rem;">Tone: Hand-drawn OMORI Menu | Style: Neo-Brutalism</p>
        </div>
        <div>
            <button onclick="exportJSON()" class="omori-btn omori-btn-success">💾 Unduh JSON</button>
            <button onclick="resetData()" class="omori-btn" style="background-color: var(--omori-pink); color: white;">⚠️ Reset</button>
        </div>
    </header>

    <div class="table-responsive">
        <table class="table table-custom">
            <thead>
                <tr class="text-uppercase" style="font-size: 1.2rem;">
                    <th>Tanggal</th>
                    <th>Divisi</th>
                    <th>Judul Konten</th>
                    <th>Status</th>
                    <th>Tautan (URL)</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="scheduler-body">
                </tbody>
        </table>
    </div>
</div>

<script>
// Data Mentah Per Divisi
const rawData = {
    multimedia: [
        "Behind The Scene Kegiatan Kami", "Cara Tim Multimedia Menyimpan Momen Berharga", "Kenapa Dokumentasi Itu Penting?", 
        "Satu Foto Bisa Jadi Cerita Panjang", "Keseruan di Balik Kamera Acara", "Tim Multimedia Kerjanya Ngapain Aja?", 
        "Belajar Kompak Lewat Dokumentasi", "Momen Kecil yang Layak Diingat", "Dari Kamera Jadi Kenangan", "Cerita Seru Saat Ambil Dokumentasi"
    ],
    humas: [
        "Jadi Penghubung Antar Warga", "Cara Menjalin Hubungan yang Baik di Lingkungan", "Barang Bersama, Dijaga Bersama", 
        "Tim Humas Kerjanya Ngapain?", "Pentingnya Komunikasi Dalam Organisasi", "Mengenal Pengelolaan Aset Lingkungan", 
        "Biar Informasi Tidak Salah Paham", "Menjaga Kepercayaan Lewat Komunikasi", "Belajar Tanggung Jawab Dari Hal Sederhana", "Kerja Sama Dimulai Dari Obrolan"
    ],
    keamanan: [
        "Kenapa Keamanan Acara Itu Penting?", "Tim yang Datang Paling Awal Pulang Paling Akhir", "Menjaga Acara Tetap Aman dan Nyaman", 
        "Kerja Tenang di Tengah Keramaian", "Hal Kecil yang Bikin Acara Tetap Tertib", "Bukan Galak, Tapi Siap Siaga", 
        "Cara Tim Keamanan Menjaga Kondusifitas", "Dibalik Lancarnya Sebuah Acara", "Kompak Menjaga Lingkungan Bersama", "Tanggung Jawab yang Sering Tidak Terlihat"
    ],
    olahraga: [
        "Sehat Bareng, Kompak Bareng", "Kenapa Kegiatan Olahraga Itu Seru?", "Menjaga Kebersamaan Lewat Kegiatan Positif", 
        "Bukan Soal Menang, Tapi Kebersamaan", "Cara Sederhana Menjaga Semangat Warga", "Olahraga Bisa Dekatkan Banyak Orang", 
        "Ruang Untuk Belajar dan Bertumbuh", "Kegiatan Positif untuk Lingkungan Lebih Baik", "Serunya Kegiatan Kebersamaan di Lingkungan", "Bergerak Bersama Dalam Hal Baik"
    ],
    wirausaha: [
        "Anak Muda dan Kreativitas Tanpa Batas", "Belajar Usaha Dari Lingkungan Sekitar", "Kenapa Seni dan Budaya Harus Dijaga?", 
        "Kreatif Itu Bisa Dimulai Dari Hal Kecil", "Ide Sederhana Bisa Jadi Peluang", "Mengenal Potensi Anak Muda di Lingkungan", 
        "Berkarya Bersama, Tumbuh Bersama", "Budaya Lokal Masih Keren Sampai Sekarang", "Belajar Mandiri Lewat Kreativitas", "Dari Hobi Bisa Jadi Peluang"
    ],
    digital: [
        "Teknologi Bisa Membantu Lingkungan Lebih Rapi", "Tim Digital Kerjanya Apa Saja?", "Kenapa Organisasi Mulai Butuh Sistem Digital?", 
        "Bukan Sekadar Website dan Media Sosial", "Cara Anak Muda Membantu Lewat Teknologi", "Belajar Adaptasi di Era Digital", 
        "Teknologi Dekat Dengan Kehidupan Sehari-hari", "Membantu Kegiatan Jadi Lebih Teratur", "Digitalisasi Bukan Hal Rumit", "Peran Teknologi Dalam Kegiatan Lingkungan"
    ]
};

const categories = [
    { key: 'multimedia', label: '📸 MULTIMEDIA' },
    { key: 'humas', label: '📢 HUMAS & ASET' },
    { key: 'keamanan', label: '🛡️ KEAMANAN' },
    { key: 'olahraga', label: '⚽ OLAHRAGA & KEROHANIAN' },
    { key: 'wirausaha', label: '🎨 KEWIRAUSAHAAN & SENI BUDAYA' },
    { key: 'digital', label: '💻 SISTEM INFORMASI DIGITAL' }
];

const STORAGE_KEY = 'content_scheduler_data';

// Inisialisasi & Pengurutan Beriringan (Selang-seling)
function generateInitialData() {
    let generatedList = [];
    let startDate = new Date(2026, 4, 12); // 12 Mei 2026 (Bulan di JS index 0 = Jan)

    // Ada 10 item per kategori, kita loop 10 kali
    for (let i = 0; i < 10; i++) {
        categories.forEach((cat) => {
            let itemDate = new Date(startDate);
            
            // Format Tanggal YYYY-MM-DD & Display Lokal
            let dateStr = itemDate.toISOString().split('T')[0];
            let displayDate = itemDate.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            generatedList.push({
                id: `${cat.key}-${i}`,
                date: dateStr,
                displayDate: displayDate,
                category: cat.label,
                title: rawData[cat.key][i],
                status: 'Planning',
                url: ''
            });

            // Tambah 1 hari untuk item berikutnya
            startDate.setDate(startDate.getDate() + 1);
        });
    }
    return generatedList;
}

// Muat Data dari LocalStorage atau buat baru
function loadData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        return JSON.parse(saved);
    } else {
        const freshData = generateInitialData();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(freshData));
        return freshData;
    }
}

// Simpan Data
function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// Render Tabel ke HTML
function renderTable() {
    const data = loadData();
    const tbody = document.getElementById('scheduler-body');
    tbody.innerHTML = '';

    data.forEach((item, index) => {
        let statusBadgeClass = 'status-planning';
        if (item.status === 'On Progress') statusBadgeClass = 'status-progress';
        if (item.status === 'Done') statusBadgeClass = 'status-done';

        let urlDisplay = item.url ? `<a href="${item.url}" target="_blank" class="text-primary fw-bold">🔗 Buka Tautan</a>` : '<span class="text-muted">-</span>';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="px-3 fw-bold">${item.displayDate}</td>
            <td class="px-3">${item.category}</td>
            <td class="px-3 text-wrap" style="max-width: 300px;">${item.title}</td>
            <td class="px-3">
                <span id="badge-${item.id}" class="badge-omori ${statusBadgeClass}">${item.status}</span>
            </td>
            <td class="px-3" id="url-${item.id}">${urlDisplay}</td>
            <td class="px-3">
                <select class="form-select-omori p-1" onchange="updateStatus('${item.id}', this.value, this)">
                    <option value="Planning" ${item.status === 'Planning' ? 'selected' : ''}>Planning</option>
                    <option value="On Progress" ${item.status === 'On Progress' ? 'selected' : ''}>On Progress</option>
                    <option value="Done" ${item.status === 'Done' ? 'selected' : ''}>Done</option>
                </select>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

// Fungsi Update Status & Trigger Popup SweetAlert saat "Done"
function updateStatus(id, newStatus, selectElement) {
    const data = loadData();
    const itemIndex = data.findIndex(d => d.id === id);
    const oldStatus = data[itemIndex].status;

    if (newStatus === 'Done') {
        Swal.fire({
            title: '✨ KONTEN SELESAI! ✨',
            text: 'Masukkan URL / Tautan hasil publikasi:',
            input: 'url',
            inputPlaceholder: 'https://...',
            showCancelButton: true,
            confirmButtonText: 'Simpan',
            cancelButtonText: 'Batal',
            confirmButtonColor: '#84b395',
            cancelButtonColor: '#d97c8f'
        }).then((result) => {
            if (result.isConfirmed && result.value) {
                // Simpan status dan URL
                data[itemIndex].status = 'Done';
                data[itemIndex].url = result.value;
                saveData(data);
                renderTable();
                Swal.fire({
                    title: 'Tersimpan!',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                });
            } else {
                // Kembalikan dropdown ke status sebelumnya jika dibatalkan
                selectElement.value = oldStatus;
            }
        });
    } else {
        // Jika statusnya bukan Done (Planning / On Progress)
        data[itemIndex].status = newStatus;
        if(newStatus === 'Planning' || newStatus === 'On Progress') {
             // Opsional: Hapus URL jika balik status, atau biarkan saja. Disini kita biarkan URLnya tetap aman.
        }
        saveData(data);
        renderTable();
    }
}

// Ekspor ke file JSON
function exportJSON() {
    const data = loadData();
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "scheduler_konten.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
}

// Reset Data (Darurat)
function resetData() {
    Swal.fire({
        title: 'Reset Semua Data?',
        text: 'Semua progres dan URL yang tersimpan akan kembali dari awal!',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#d97c8f',
        cancelButtonColor: '#84b395',
        confirmButtonText: 'Ya, Reset!'
    }).then((result) => {
        if (result.isConfirmed) {
            localStorage.removeItem(STORAGE_KEY);
            renderTable();
            Swal.fire({ title: 'Di-reset!', icon: 'success', timer: 1000, showConfirmButton: false });
        }
    });
}

// Jalankan saat pertama kali dimuat
document.addEventListener('DOMContentLoaded', renderTable);
</script>

</body>
</html>
